name: Update contributions card

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render card
        run: python scripts/contributions.py "${{ github.repository_owner }}" assets/contributions.svg
      - name: Commit if changed
        run: |
          if git diff --quiet -- assets/contributions.svg; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contributions.svg
          git commit -m "Update contributions card"
          git push
