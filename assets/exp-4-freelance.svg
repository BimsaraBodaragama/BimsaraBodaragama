.chip{fill:#161b22;stroke:#30363d}.t{fill:#e6edf3}.m{fill:#9198a1}.a{fill:#4493f8}.ln{stroke:#30363d}
.dot{fill:#0d1117;stroke:#4493f8}}
.pulse{fill:none;stroke:#0969da;transform-box:fill-box;transform-origin:center;animation:pulse 2.4s ease-out infinite}@keyframes pulse{0%{transform:scale(1);opacity:.55}100%{transform:scale(2.6);opacity:0}}.sw{stop-color:#ffffff;stop-opacity:.75}@media (prefers-color-scheme:dark){.pulse{stroke:#4493f8}.sw{stop-opacity:.07}}@media (prefers-reduced-motion:reduce){.pulse,.sweep{animation:none!important;display:none}}.sweep{animation:sweep 8s ease-in-out 2.7s infinite;transform:translateX(-170px)}@keyframes sweep{0%,60%{transform:translateX(-170px)}88%,100%{transform:translateX(569px)}}</style><line class="ln" x1="16" y1="0" x2="16" y2="26" stroke-width="2"/><circle class="pulse" cx="16" cy="26" r="6" stroke-width="2" style="animation-delay:2.7s"/><circle class="dot" cx="16" cy="26" r="6" stroke-width="2.5"/><rect class="tile" x="34.5" y=".5" width="379" height="177" rx="8"/><defs><clipPath id="tc"><rect x="34.5" y=".5" width="379" height="177" rx="8"/></clipPath><linearGradient id="sg" x1="0" x2="1"><stop offset="0" class="sw" style="stop-opacity:0"/><stop offset=".5" class="sw"/><stop offset="1" class="sw" style="stop-opacity:0"/></linearGradient></defs><g clip-path="url(#tc)"><rect class="sweep" x="34" y="0" width="150" height="178" fill="url(#sg)" transform="skewX(-12)"/></g><text x="52" y="32" class="t" font-size="15" font-weight="600" text-anchor="start" >Freelance</text><text x="52" y="51" class="m" font-size="12.5" font-weight="400" text-anchor="start" >Java, Spring Boot, Thymeleaf, MySQL</text><text x="52" y="76" class="t" font-size="13.5" font-weight="400" text-anchor="start" >Software Developer &amp; Project Owner</text><text x="52" y="95" class="m" font-size="12.5" font-weight="400" text-anchor="start" >Jan 2021 – May 2024</text><text x="52" y="118" class="m" font-size="12.5" font-weight="400" text-anchor="start" >Student and finance management platform</text></svg>